<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>moldgen</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="app">
    <div id="viewport">
      <div id="drop-hint" class="hidden">Drop STL · 3MF · OBJ</div>
    </div>
    <aside id="sidebar">
      <h1>moldgen</h1>
      <p class="tagline">Two-part molds for carbon fiber work</p>

      <section class="panel">
        <h2>Part</h2>
        <label class="file-drop" for="part-upload">
          <strong>Drop a file</strong> or click to browse
          <span class="sub">STL · 3MF · OBJ &nbsp;·&nbsp; millimeters</span>
          <input type="file" id="part-upload" accept=".stl,.3mf,.obj" />
        </label>
        <div id="part-info" class="hidden">
          <div class="kv"><span>File</span><span id="info-name"></span></div>
          <div class="kv"><span>Size</span><span id="info-dims"></span></div>
          <div class="kv"><span>Triangles</span><span id="info-tris"></span></div>
          <div class="kv"><span>Watertight</span><span id="info-watertight"></span></div>
        </div>
        <ul id="part-warnings" class="warnings"></ul>
      </section>

      <section class="panel">
        <h2>Parting plane</h2>
        <div class="row">
          <input type="range" id="parting-z" step="0.1" disabled />
          <output id="parting-z-out">—</output>
        </div>
        <p class="hint">
          <button class="link hidden" id="use-suggested"></button>
        </p>
        <button id="analyze" class="secondary" disabled>Analyze undercuts</button>
        <div id="verdicts" class="hidden">
          <div class="kv"><span>Bottom half (−Z pull)</span><span id="verdict-bottom"></span></div>
          <div class="kv"><span>Top half (+Z pull)</span><span id="verdict-top"></span></div>
        </div>
      </section>

      <section class="panel">
        <h2>Mold style</h2>
        <label class="radio">
          <input type="radio" name="mold-style" value="compression" checked />
          Compression / forged carbon
        </label>
        <label class="radio">
          <input type="radio" name="mold-style" value="open_layup" />
          Open layup (single-sided tool)
        </label>
        <div id="open-layup-opts" class="hidden">
          <label class="field"><span>Keep side</span>
            <select id="keep-side">
              <option value="below">Below plane</option>
              <option value="above">Above plane</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" id="trim-groove" /> Trim groove on flange</label>
        </div>
        <label class="field"><span>Wall margin (mm)</span>
          <input type="number" id="wall-margin" value="15" min="4" step="1" />
        </label>
        <label class="field"><span>Cavity offset (mm)</span>
          <input type="number" id="cavity-offset" value="0" step="0.05" />
        </label>
      </section>

      <section class="panel" id="hardware-panel">
        <h2>Hardware</h2>
        <label class="check"><input type="checkbox" id="pins" checked /> Registration pins</label>
        <label class="field" id="pin-clearance-field"><span>Pin clearance</span>
          <select id="pin-clearance">
            <option value="0.15">0.15 mm — resin</option>
            <option value="0.25">0.25 mm — FDM</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="bolts" /> Clamping bolt holes</label>
        <div id="bolt-opts" class="hidden">
          <label class="field"><span>Bolts</span>
            <select id="bolt-count">
              <option value="2">2</option>
              <option value="4" selected>4</option>
            </select>
          </label>
          <label class="field"><span>Size</span>
            <select id="bolt-diameter">
              <option value="6">M6</option>
              <option value="8">M8</option>
            </select>
          </label>
        </div>
      </section>

      <section class="panel">
        <button id="generate" disabled>Generate mold</button>
        <div id="result" class="hidden">
          <div class="row" id="explode-row">
            <span class="lbl">Explode</span>
            <input type="range" id="explode" min="0" max="1" step="0.01" value="0" />
          </div>
          <label class="check"><input type="checkbox" id="ghost" /> Ghost part in cavity</label>
          <div id="downloads"></div>
          <ul id="gen-warnings" class="warnings"></ul>
        </div>
      </section>

      <footer id="status">ready</footer>
    </aside>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
