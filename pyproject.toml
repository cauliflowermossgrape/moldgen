[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moldgen"
version = "0.1.0"
description = "Two-part mold generator for carbon fiber work: upload a part (STL/3MF), get a printable/machinable mold"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "trimesh>=4.4",
    "manifold3d>=2.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.2",
    "lxml>=5.0",
    # trimesh uses this to sniff ASCII-vs-binary STL; without it a corrupt
    # upload surfaces as a confusing "No module named charset_normalizer"
    "charset-normalizer>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# STEP/IGES input via OpenCascade — the OCP wheel is several hundred MB,
# hence opt-in
step = [
    "cadquery>=2.4",
]

[tool.setuptools.packages.find]
include = ["moldgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
