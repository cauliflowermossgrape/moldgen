[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moldgen"
version = "0.2.1"
description = "Generate 3D-printable / CNC molds for carbon fiber work: forged carbon compression moulds, prepreg laminating tools and open-layup tools from STL/3MF/OBJ/STEP parts"
keywords = [
    "carbon-fiber", "carbon-fibre", "forged-carbon", "mold", "mould",
    "compression-molding", "prepreg", "vacuum-bagging", "composites",
    "3d-printing", "cnc", "mold-making",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "trimesh>=4.4",
    "manifold3d>=2.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.2",
    "lxml>=5.0",
    # trimesh uses this to sniff ASCII-vs-binary STL; without it a corrupt
    # upload surfaces as a confusing "No module named charset_normalizer"
    "charset-normalizer>=3.0",
]

[project.urls]
Homepage = "https://github.com/cauliflowermossgrape/moldgen"
Changelog = "https://github.com/cauliflowermossgrape/moldgen/blob/main/CHANGELOG.md"
Issues = "https://github.com/cauliflowermossgrape/moldgen/issues"

[project.scripts]
moldgen = "moldgen.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]
# STEP/IGES input via OpenCascade — the OCP wheel is several hundred MB,
# hence opt-in
step = [
    "cadquery>=2.4",
]

[tool.setuptools.packages.find]
include = ["moldgen*"]

[tool.setuptools.package-data]
# the web UI ships inside the package so installed wheels can serve it
moldgen = ["frontend/*", "frontend/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
